name: Aplicativo Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas de build
        run: python -m pip install -r requirements-build.txt
      - name: Testar
        run: python -m unittest discover -s tests -v
      - name: Testar interface
        run: python tests/ui_smoke.py
      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/app.ico --add-data "assets;assets" --name ResultadoDaLigaALSA resultado_app.py
      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: ResultadoDaLigaALSA-Windows
          path: dist/ResultadoDaLigaALSA.exe
      - name: Publicar executável na versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME dist/ResultadoDaLigaALSA.exe --title "Resultado da Liga ALSA $env:GITHUB_REF_NAME" --generate-notes
          } else {
            gh release upload $env:GITHUB_REF_NAME dist/ResultadoDaLigaALSA.exe --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
